<!DOCTYPE html>
<html lang="az">
<head>
<meta charset="UTF-8">
<title>Canım Günəşim ❤️</title>
<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #b8002a, #ff4d6d);
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
}

.card {
    background: #fff;
    border-radius: 24px;
    padding: 36px 30px;
    max-width: 420px;
    text-align: center;
    box-shadow: 0 18px 45px rgba(0,0,0,0.35);
}

.sun {
    font-size: 50px;
    margin-bottom: 10px;
}

h1 {
    color: #c4003a;
    margin-bottom: 14px;
}

p {
    color: #444;
    font-size: 16.5px;
    line-height: 1.75;
}

.highlight {
    color: #c4003a;
    font-weight: 700;
}

.footer {
    margin-top: 22px;
    font-size: 14px;
    color: #888;
}
</style>
</head>
<body>

<div class="card">
    <div class="sun">☀️❤️</div>
    <h1>Fədolim</h1>

    <p>
        Mən səni sözlə ifadə olunacaq qədər yox,<br>
        ürəklə hiss olunacaq qədər sevirəm 💗
    </p>

    <p>
        Sən mənim <span class="highlight">canımsan</span>,<br>
        hər döyüntüdə adın var…
    </p>

    <p>
        Sən mənim <span class="highlight">günəşimsən</span> ☀️<br>
        Qaranlıqda yolumu tapdıran,<br>
        ruhumu isidən tək işıq ✨
    </p>

    <p>
        Nə olursa-olsun,<br>
        ürəyim həmişə sənə tərəfdir ❤️
    </p>

    <div class="footer">
        Canım günəşim üçün 💌
    </div>
</div>

</body>
</html>
